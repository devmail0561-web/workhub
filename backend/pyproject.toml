[project]
name = "workhub"
version = "0.1.0"
description = "Référentiel de compétences, projets, plans de travail et Skills"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyjwt>=2.9",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=24.4",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "import-linter>=2.1",
    "pip-audit>=2.7",
    "pre-commit>=4.0",
    "pyright>=1.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "testcontainers[postgres]>=4.9",
]

[project.scripts]
workhub-bootstrap = "workhub.iam.bootstrap:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workhub"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["workhub"]

[tool.pyright]
include = ["src", "tests", "migrations"]
exclude = [".venv", "**/__pycache__"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src", "."]
addopts = "-ra --cov=workhub --cov-report=term-missing"
markers = [
    "integration: test nécessitant un vrai PostgreSQL (testcontainers)",
]

[tool.coverage.run]
source = ["workhub"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.importlinter]
root_package = "workhub"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "1. Le domaine ne dépend d'aucun framework technique"
type = "forbidden"
source_modules = ["workhub.*.domain"]
forbidden_modules = [
    "fastapi",
    "sqlalchemy",
    "workhub.*.application",
    "workhub.*.infrastructure",
    "workhub.interfaces",
]

[[tool.importlinter.contracts]]
name = "2. La couche application ignore infrastructure et interfaces"
type = "forbidden"
source_modules = ["workhub.*.application"]
forbidden_modules = ["workhub.*.infrastructure", "workhub.interfaces"]

[[tool.importlinter.contracts]]
name = "3. Indépendance des modules métier (tout couplage doit être déclaré explicitement)"
type = "independence"
modules = [
    "workhub.iam",
    "workhub.skills",
    "workhub.projects",
    "workhub.plans",
    "workhub.competencies",
    "workhub.execution",
    "workhub.knowledge",
    "workhub.tools",
    "workhub.proposals",
    "workhub.integrations",
    "workhub.audit",
]
ignore_imports = [
    "workhub.iam.application.integrations -> workhub.audit.api",
    "workhub.iam.api -> workhub.audit.infrastructure.repositories",
    "workhub.skills.application.service -> workhub.audit.api",
    "workhub.skills.api -> workhub.audit.infrastructure.repositories",
    "workhub.skills.api -> workhub.iam.api",
]

[[tool.importlinter.contracts]]
name = "4. Les interfaces ne parlent qu'à la couche application"
type = "forbidden"
source_modules = ["workhub.interfaces.rest", "workhub.interfaces.mcp"]
forbidden_modules = ["workhub.*.domain", "workhub.*.infrastructure"]
# Le noyau shared est autorisé via son api.py (réexporte des types de son domaine).
ignore_imports = [
    "workhub.shared.api -> workhub.shared.domain.*",
    "workhub.interfaces.rest.auth -> workhub.iam.api",
    "workhub.interfaces.rest.dependencies -> workhub.iam.api",
    "workhub.interfaces.rest.integrations -> workhub.iam.api",
    "workhub.interfaces.rest.app -> workhub.iam.api",
    "workhub.interfaces.rest.skills -> workhub.skills.api",
]

[[tool.importlinter.contracts]]
name = "6. Le noyau shared ne dépend d'aucun module métier"
type = "forbidden"
source_modules = ["workhub.shared"]
forbidden_modules = [
    "workhub.iam",
    "workhub.skills",
    "workhub.projects",
    "workhub.plans",
    "workhub.competencies",
    "workhub.execution",
    "workhub.knowledge",
    "workhub.tools",
    "workhub.proposals",
    "workhub.integrations",
    "workhub.audit",
]

[[tool.importlinter.contracts]]
name = "7. Les modules métier n'importent de shared que son API publique"
type = "forbidden"
source_modules = [
    "workhub.iam",
    "workhub.skills",
    "workhub.projects",
    "workhub.plans",
    "workhub.competencies",
    "workhub.execution",
    "workhub.knowledge",
    "workhub.tools",
    "workhub.proposals",
    "workhub.integrations",
    "workhub.audit",
]
forbidden_modules = [
    "workhub.shared.domain",
    "workhub.shared.application",
    "workhub.shared.infrastructure",
]
# `shared.api` est le point d'entrée autorisé ; ses réexports internes sont donc ignorés.
# La primitive de persistance est consommée uniquement par l'adaptateur d'infrastructure.
ignore_imports = [
    "workhub.shared.api -> workhub.shared.domain.*",
    "workhub.iam.infrastructure.database -> workhub.shared.infrastructure.database",
    "workhub.audit.infrastructure.repositories -> workhub.shared.infrastructure.database",
    "workhub.skills.infrastructure.repositories -> workhub.shared.infrastructure.database",
]
