name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, architecture, tests)
    runs-on: [self-hosted, linux, x64]
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: workhub
          POSTGRES_PASSWORD: workhub
          POSTGRES_DB: workhub_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U workhub -d workhub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://workhub:workhub@localhost:55432/workhub_test

    steps:
      - uses: actions/checkout@v7

      - name: Installer uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Installer Python 3.12
        run: uv python install 3.12

      - name: Installer les dépendances
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format (ruff)
        run: uv run ruff format --check .

      - name: Typage (pyright strict)
        run: uv run pyright

      - name: Architecture (import-linter)
        run: uv run lint-imports

      - name: Tests (pytest)
        run: uv run pytest

      - name: Audit des dépendances (pip-audit)
        run: uv run pip-audit

  cli:
    name: CLI (lint, types, tests, architecture)
    runs-on: [self-hosted, linux, x64]
    defaults:
      run:
        working-directory: cli

    steps:
      - uses: actions/checkout@v7

      - name: Installer uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Installer Python 3.12
        run: uv python install 3.12

      - name: Installer les dépendances
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format (ruff)
        run: uv run ruff format --check .

      - name: Typage (pyright strict)
        run: uv run pyright

      - name: Architecture (import-linter)
        run: uv run lint-imports

      - name: Tests (pytest)
        run: uv run pytest

      - name: Audit des dépendances (pip-audit)
        run: uv run pip-audit

  frontend:
    name: Frontend (types, tests, build)
    runs-on: [self-hosted, linux, x64]
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Installer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Typage (tsc strict)
        run: pnpm run typecheck

      - name: Tests (Vitest)
        run: pnpm run test

      - name: Build (Vite)
        run: pnpm run build

  docker:
    name: Build Docker
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v7

      - name: Valider la configuration Compose
        working-directory: deploy
        run: docker compose --env-file .env.example config --quiet

      - name: Construire l'image API
        run: docker build -t workhub-api:ci backend

      - name: Construire l'image web
        run: docker build -t workhub-web:ci frontend
