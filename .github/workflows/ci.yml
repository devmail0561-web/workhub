name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, architecture, tests)
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: workhub
          POSTGRES_PASSWORD: workhub
          POSTGRES_DB: workhub_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U workhub -d workhub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://workhub:workhub@localhost:55432/workhub_test
      WORKHUB_TEST_DATABASE_URL: postgresql+psycopg://workhub:workhub@localhost:55432/workhub_test
      WORKHUB_ENV: test
      WORKHUB_SECRET_KEY: test-secret-key-0123456789abcdef

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Installer uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          enable-cache: true

      - name: Installer Python 3.12
        run: uv python install 3.12

      - name: Installer les dépendances
        run: uv sync --frozen

      - name: Vérifier le snapshot OpenAPI
        run: >-
          uv run python -c "import json; from workhub.interfaces.rest.app import app;
          expected = json.load(open('../frontend/openapi.json'));
          assert app.openapi() == expected, 'Snapshot OpenAPI obsolète'"

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format (ruff)
        run: uv run ruff format --check .

      - name: Typage (pyright strict)
        run: uv run pyright

      - name: Architecture (import-linter)
        run: uv run lint-imports

      - name: Vérifier upgrade/downgrade/upgrade Alembic
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade 0001_schema_v0
          uv run alembic upgrade head

      - name: Tests (pytest)
        run: uv run pytest

      - name: Audit des dépendances (pip-audit)
        run: uv run pip-audit

  cli:
    name: CLI (lint, types, tests, architecture)
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: cli

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Installer uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          enable-cache: true

      - name: Installer Python 3.12
        run: uv python install 3.12

      - name: Installer les dépendances
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format (ruff)
        run: uv run ruff format --check .

      - name: Typage (pyright strict)
        run: uv run pyright

      - name: Architecture (import-linter)
        run: uv run lint-imports

      - name: Tests (pytest)
        run: uv run pytest

      - name: Audit des dépendances (pip-audit)
        run: uv run pip-audit

  frontend:
    name: Frontend (types, tests, build)
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Installer pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.32.1

      - name: Vérifier Node.js (système, 20.19+ requis)
        run: node --version

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Audit des dépendances (pnpm)
        run: pnpm audit --prod

      - name: Typage (tsc strict)
        run: pnpm run typecheck

      - name: Vérifier les types OpenAPI
        run: |
          cp src/api/schema.d.ts /tmp/workhub-schema.d.ts
          pnpm run generate:api
          diff -u /tmp/workhub-schema.d.ts src/api/schema.d.ts

      - name: Tests (Vitest)
        run: pnpm run test

      - name: Build (Vite)
        run: pnpm run build

  docker:
    name: Build Docker
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Valider la configuration Compose
        working-directory: deploy
        run: docker compose --env-file .env.example config --quiet

      - name: Construire l'image API
        run: docker build -t workhub-api:ci backend

      - name: Construire l'image web
        run: docker build -t workhub-web:ci frontend
