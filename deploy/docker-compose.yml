name: workhub

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-common-environment: &common-environment
  WORKHUB_ENV: ${WORKHUB_ENV:-production}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-app-environment: &app-environment
  <<: *common-environment
  DATABASE_URL: postgresql+psycopg://workhub_app:${WORKHUB_APP_PASSWORD:?Définir WORKHUB_APP_PASSWORD dans deploy/.env}@db:5432/${POSTGRES_DB:-workhub}
  WORKHUB_SECRET_KEY: ${WORKHUB_SECRET_KEY:?Définir WORKHUB_SECRET_KEY dans deploy/.env}
  WORKHUB_TRUSTED_PROXIES: ${WORKHUB_TRUSTED_PROXIES:-172.28.0.10}
  WORKHUB_COOKIE_SECURE: ${WORKHUB_COOKIE_SECURE:-false}
  WORKHUB_ACCESS_TOKEN_TTL_SECONDS: ${WORKHUB_ACCESS_TOKEN_TTL_SECONDS:-900}
  WORKHUB_REFRESH_TOKEN_TTL_SECONDS: ${WORKHUB_REFRESH_TOKEN_TTL_SECONDS:-2592000}
  WORKHUB_LOGIN_MAX_ATTEMPTS: ${WORKHUB_LOGIN_MAX_ATTEMPTS:-5}
  WORKHUB_LOGIN_ATTEMPT_WINDOW_SECONDS: ${WORKHUB_LOGIN_ATTEMPT_WINDOW_SECONDS:-900}
  WORKHUB_LOGIN_LOCK_SECONDS: ${WORKHUB_LOGIN_LOCK_SECONDS:-900}

x-owner-environment: &owner-environment
  <<: *common-environment
  DATABASE_URL: postgresql+psycopg://workhub_owner:${WORKHUB_OWNER_PASSWORD:?Définir WORKHUB_OWNER_PASSWORD dans deploy/.env}@db:5432/${POSTGRES_DB:-workhub}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-workhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-workhub}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workhub} -d ${POSTGRES_DB:-workhub}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 256
    logging: *default-logging
    restart: unless-stopped

  db-bootstrap:
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    environment:
      PGHOST: db
      PGPORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-workhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-workhub}
      WORKHUB_OWNER_PASSWORD: ${WORKHUB_OWNER_PASSWORD:?Définir WORKHUB_OWNER_PASSWORD dans deploy/.env}
      WORKHUB_APP_PASSWORD: ${WORKHUB_APP_PASSWORD:?Définir WORKHUB_APP_PASSWORD dans deploy/.env}
    volumes:
      - ./postgres/bootstrap.sh:/bootstrap.sh:ro
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy

  migrate:
    build:
      context: ../backend
    command: ["alembic", "upgrade", "head"]
    environment: *owner-environment
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully

  db-grants:
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "/permissions.sh"]
    environment:
      PGHOST: db
      PGPORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-workhub}
      WORKHUB_OWNER_PASSWORD: ${WORKHUB_OWNER_PASSWORD:?Définir WORKHUB_OWNER_PASSWORD dans deploy/.env}
    volumes:
      - ./postgres/permissions.sh:/permissions.sh:ro
    networks:
      - backend
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: ../backend
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      db-grants:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - backend
      - frontend
    restart: unless-stopped

  web:
    build:
      context: ../frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      frontend:
        ipv4_address: 172.28.0.10
    restart: unless-stopped

networks:
  backend:
    ipam:
      config:
        - subnet: 172.28.1.0/24
  frontend:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  pgdata:
