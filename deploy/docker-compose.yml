name: workhub

x-common-environment: &common-environment
  WORKHUB_ENV: ${WORKHUB_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-app-environment: &app-environment
  <<: *common-environment
  DATABASE_URL: postgresql+psycopg://workhub_app:${WORKHUB_APP_PASSWORD:?Définir WORKHUB_APP_PASSWORD dans deploy/.env}@db:5432/${POSTGRES_DB:-workhub}

x-owner-environment: &owner-environment
  <<: *common-environment
  DATABASE_URL: postgresql+psycopg://workhub_owner:${WORKHUB_OWNER_PASSWORD:?Définir WORKHUB_OWNER_PASSWORD dans deploy/.env}@db:5432/${POSTGRES_DB:-workhub}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-workhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-workhub}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workhub} -d ${POSTGRES_DB:-workhub}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  db-bootstrap:
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    environment:
      PGHOST: db
      PGPORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-workhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-workhub}
      WORKHUB_OWNER_PASSWORD: ${WORKHUB_OWNER_PASSWORD:?Définir WORKHUB_OWNER_PASSWORD dans deploy/.env}
      WORKHUB_APP_PASSWORD: ${WORKHUB_APP_PASSWORD:?Définir WORKHUB_APP_PASSWORD dans deploy/.env}
    volumes:
      - ./postgres/bootstrap.sh:/bootstrap.sh:ro
    depends_on:
      db:
        condition: service_healthy

  migrate:
    build:
      context: ../backend
    command: ["alembic", "upgrade", "head"]
    environment: *owner-environment
    depends_on:
      db:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully

  db-grants:
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "/permissions.sh"]
    environment:
      PGHOST: db
      PGPORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-workhub}
      WORKHUB_OWNER_PASSWORD: ${WORKHUB_OWNER_PASSWORD:?Définir WORKHUB_OWNER_PASSWORD dans deploy/.env}
    volumes:
      - ./postgres/permissions.sh:/permissions.sh:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: ../backend
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      db-grants:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: ../frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
